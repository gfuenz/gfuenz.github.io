<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interests and Hobbies | Gabriela Fuenzalida</title>
    <meta name="description" content="Interests and Hobbies page for Gabriela Fuenzalida's ECE ePortfolio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .interest-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .image-slot {
        min-height: 220px;
        border: 2px dashed rgba(24, 58, 42, 0.25);
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(201, 220, 202, 0.18), rgba(255, 255, 255, 0.5));
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--green-700);
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .interest-photo {
        width: 100%;
        height: 100%;
        min-height: 220px;
        object-fit: cover;
        border-radius: 20px;
      }

      @media (max-width: 700px) {
        .interest-gallery {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">Gabriela Fuenzalida</div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About Me</a>
          <a href="resume.html">Resume</a>
          <a href="goals.html">Career Goals</a>
          <a href="projects.html">Projects</a>
          <a href="interests.html" class="active">Interests and Hobbies</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container page-hero-inner">
          <h1>Interests and Hobbies</h1>
        </div>
      </section>

      <section class="page-content">
        <div class="container">
          <div class="page-panel">
            <div class="interest-gallery">
              <img
                class="interest-photo"
                src="assets/interests-hiking.jpg"
                alt="Gabriela backpacking in the mountains"
              />
              <img
                class="interest-photo"
                src="assets/interests-artwork.jpg"
                alt="Gabriela standing beside her artwork at an exhibition"
              />
            </div>
            <p>
              Outside of my coursework, I enjoy outdoor sports such as backpacking and cascading, and I create art!
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <p class="footer-title">Gabriela Fuenzalida</p>
        </div>
        <div class="footer-links">
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </footer>
  </body>
</html>
